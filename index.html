<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laollaga Istmeña | Catálogo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .oro { color: #d4af37; }
        .rojo-istmo { color: #b91c1c; }
        .tab-activa { border-bottom: 4px solid #b91c1c; color: #000; font-weight: bold; }
        .tab-inactiva { border-bottom: 4px solid transparent; color: #6b7280; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <header class="bg-black text-center py-10 px-4 shadow-xl relative overflow-hidden">
        <h1 class="text-4xl md:text-5xl font-serif oro tracking-widest uppercase relative z-10 drop-shadow-md">Laollaga Istmeña</h1>
        <p class="text-white mt-3 font-light tracking-widest uppercase text-sm relative z-10">La elegancia del Istmo se viste aquí</p>
        <div class="absolute bottom-0 left-0 w-full h-1 bg-gradient-to-r from-red-900 via-red-600 to-red-900"></div>
    </header>

    <main class="max-w-6xl mx-auto p-4 md:p-8">
        <!-- Navegación por Pestañas -->
        <div class="flex justify-center mb-8 border-b border-gray-300" id="tabs-container"></div>
        
        <!-- Contenedor Dinámico -->
        <div id="catalogo" class="text-center py-20 text-gray-500 font-bold animate-pulse">Sincronizando inventario de alta calidad...</div>
    </main>

    <script>
        let datosInventario = {};

        async function cargarCatalogo() {
            const contenedor = document.getElementById('catalogo');
            try {
                if (typeof window.supabase === 'undefined') throw new Error('El navegador no descargó la librería a tiempo. Recarga la página.');
                
                const supabase = window.supabase.createClient('https://dmpovogobkqxiuqiqdku.supabase.co', 'sb_publishable_vxjNB2Og59jiF0wazOFJBw_-Cj1-q1I');
                const { data, error } = await supabase.from('productos').select('*').eq('estado', 'Disponible').order('codigo_interno', { ascending: true });
                
                if (error) throw new Error(error.message);
                
                if (!data || data.length === 0) {
                    contenedor.innerHTML = '<p class="text-center font-bold text-gray-600 mt-10">Catálogo temporalmente sin disponibilidad.</p>';
                    return;
                }

                datosInventario = {};
                data.forEach(item => {
                    if(!datosInventario[item.categoria]) datosInventario[item.categoria] = [];
                    datosInventario[item.categoria].push(item);
                });

                generarPestañas();
                const primeraCat = Object.keys(datosInventario)[0];
                mostrarCategoria(primeraCat);
            } catch (err) {
                contenedor.innerHTML = `<div class="bg-red-100 border-l-4 border-red-600 text-red-900 p-4 shadow mt-10"><p class="font-bold">Error Técnico:</p><p>${err.message}</p></div>`;
            }
        }

        function generarPestañas() {
            let html = '';
            for (const cat in datosInventario) {
                html += `<button onclick="mostrarCategoria('${cat}')" id="tab-${cat.replace(/\s+/g, '')}" class="px-6 py-3 text-sm md:text-base uppercase tracking-wider transition-colors tab-inactiva hover:text-black">${cat}</button>`;
            }
            document.getElementById('tabs-container').innerHTML = html;
        }

        window.mostrarCategoria = function(categoriaSeleccionada) {
            for (const cat in datosInventario) {
                const btn = document.getElementById(`tab-${cat.replace(/\s+/g, '')}`);
                if(cat === categoriaSeleccionada) {
                    btn.classList.remove('tab-inactiva'); btn.classList.add('tab-activa');
                } else {
                    btn.classList.remove('tab-activa'); btn.classList.add('tab-inactiva');
                }
            }

            const productos = datosInventario[categoriaSeleccionada];
            let html = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">`;
            
            productos.forEach(p => {
                const imgPath = p.imagen_url 
                    ? `https://dmpovogobkqxiuqiqdku.supabase.co/storage/v1/object/public/catalogo/${p.imagen_url}` 
                    : 'https://via.placeholder.com/600x800.png?text=Fotograf%C3%ADa+en+proceso';
                
                const textoWapp = `Hola Laollaga Istmeña, me interesa adquirir: ${p.codigo_interno} - ${p.nombre_comercial}`;
                const enlaceWapp = `https://wa.me/529711140709?text=${encodeURIComponent(textoWapp)}`;
                
                html += `
                <div class="bg-white rounded-xl shadow-lg border border-gray-200 flex flex-col overflow-hidden">

                    <div class="relative h-96 bg-gray-100">
                        <img src="${imgPath}" alt="${p.nombre_comercial}" class="w-full h-full object-cover object-top" onerror="this.src='https://via.placeholder.com/600x800.png?text=Error+de+Imagen'">
                        <div class="absolute top-4 left-4 bg-green-500 text-white text-xs font-bold px-3 py-1 rounded shadow-md tracking-widest uppercase">Disponible</div>
                    </div>
                    <div class="p-6 flex-grow flex flex-col justify-between">
                        <div>
                            <h3 class="text-2xl font-serif font-bold text-gray-900 leading-tight mb-2">${p.nombre_comercial}</h3>
                            <p class="text-3xl font-light text-[#d4af37] mb-6">$${p.precio} <span class="text-sm text-gray-400">MXN</span></p>
                            <div class="text-sm text-gray-600 space-y-2 mb-6">
                                <p class="flex justify-between border-b border-gray-50 pb-1"><span>Medidas:</span> <span class="font-medium text-black text-right">${p.talla || ''} ${p.medidas && p.medidas !== 'N/A' ? p.medidas : ''}</span></p>
                                <p class="flex justify-between border-b border-gray-50 pb-1"><span>Material:</span> <span class="font-medium text-black text-right">${p.material}</span></p>
                                <p class="flex justify-between border-b border-gray-50 pb-1"><span>Cuidados:</span> <span class="font-medium text-black text-right">${p.cuidados}</span></p>
                            </div>
                        </div>
                        <a href="${enlaceWapp}" target="_blank" class="block w-full text-center bg-black hover:bg-[#b91c1c] text-white font-bold py-4 rounded uppercase text-sm tracking-widest transition-colors shadow-md">
                            Comprar Vía WhatsApp
                        </a>
                    </div>
                </div>`;
            });
            html += `</div>`;
            document.getElementById('catalogo').innerHTML = html;
        }

        // Retraso de 600ms para asegurar la carga de la librería antes de ejecutar la lógica
        setTimeout(cargarCatalogo, 600);
    </script>
</body>
</html>
