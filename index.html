<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laollaga Istmeña | Catálogo Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .oro { color: #d4af37; }
        .bg-textura { background-image: url('https://www.transparenttextures.com/patterns/cream-paper.png'); }
        .tab-activa { border-bottom: 3px solid #000; color: #000; font-weight: bold; }
        .tab-inactiva { border-bottom: 3px solid transparent; color: #9ca3af; }
        
        /* Efecto Zoom Interactivo por Click / Táctil */
        .zoom-activo {
            transform: scale(1.8);
            cursor: zoom-out !important;
        }
        .zoom-normal {
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: zoom-in;
        }
    </style>
</head>
<body class="bg-[#fcfbf9] bg-textura bg-fixed text-gray-800 font-sans antialiased selection:bg-black selection:text-white">
    
    <!-- Header Premium Inmersivo con Logo Forzado -->
    <header class="bg-[#0a0a0a] text-center py-12 md:py-16 px-4 shadow-2xl relative overflow-hidden bg-[url('https://www.transparenttextures.com/patterns/stardust.png')]">
        
        <!-- Contenedor del Logo con doble ruta de respaldo -->
        <div class="max-w-[180px] md:max-w-[220px] mx-auto mb-6 relative z-10">
            <div class="w-36 h-36 md:w-44 md:h-44 mx-auto rounded-full p-1 bg-black shadow-[0_0_50px_rgba(212,175,55,0.4)] border-2 border-[#d4af37] flex items-center justify-center overflow-hidden">
                <img src="https://dmpovogobkqxiuqiqdku.supabase.co/storage/v1/object/public/catalogo/logo.png" alt="Laollaga Istmeña" class="w-full h-full object-cover rounded-full" onerror="this.src='https://dmpovogobkqxiuqiqdku.supabase.co/storage/v1/object/public/catalogo/Laollaga_istmena_cutout(1).png'">
            </div>
        </div>
        
        <h1 class="text-3xl md:text-5xl font-serif oro tracking-widest uppercase relative z-10 drop-shadow-md mb-2">Laollaga Istmeña</h1>
        <p class="font-serif italic text-gray-300 text-sm md:text-lg tracking-[0.2em] relative z-10 opacity-90">Arte tejido, tradición que se viste.</p>
        
        <div class="absolute bottom-0 left-0 w-full h-1.5 bg-gradient-to-r from-yellow-700 via-yellow-400 to-yellow-700"></div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-10 min-h-screen">
        <!-- Pestañas de Navegación -->
        <div class="flex justify-center mb-10 md:mb-14 border-b border-gray-200 overflow-x-auto" id="tabs-container"></div>
        
        <!-- Cuadrícula del Catálogo -->
        <div id="catalogo">
            <div class="text-center py-20 text-gray-400 font-bold uppercase tracking-widest text-sm animate-pulse">Cargando colección exclusiva...</div>
        </div>
        
        <!-- Paginación -->
        <div id="paginacion" class="flex justify-center items-center gap-4 mt-16 hidden"></div>
    </main>

    <!-- Pantalla de Detalle (Modal con Zoom Táctil de Precisión) -->
    <div id="modal-producto" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-md hidden flex-col overflow-y-auto transition-opacity duration-300 opacity-0">
        <div class="min-h-screen w-full flex flex-col md:flex-row bg-[#fcfbf9] relative shadow-2xl">
            <!-- Botón flotante para regresar -->
            <button onclick="cerrarDetalle()" class="absolute top-4 left-4 md:top-8 md:left-8 z-30 bg-black/80 hover:bg-black text-white px-5 py-2.5 rounded-full font-bold uppercase text-xs tracking-widest transition-all shadow-xl backdrop-blur-sm flex items-center gap-2">
                <i class="fas fa-arrow-left"></i> Volver al catálogo
            </button>
            
            <div id="modal-content" class="flex flex-col md:flex-row w-full min-h-screen"></div>
        </div>
    </div>

    <!-- Footer Elegante -->
    <footer class="bg-black text-center py-8 border-t-2 border-[#d4af37] mt-20 text-gray-400 text-xs tracking-[0.2em] uppercase">
        &copy; 2026 Laollaga Istmeña. Tradición y Elegancia del Istmo.
    </footer>

    <script>
        let datosInventario = {};
        let todosLosProductos = [];
        let categoriaActual = '';
        let paginaActual = 1;
        const itemsPorPagina = 6;

        async function cargarCatalogo() {
            const contenedor = document.getElementById('catalogo');
            try {
                if (typeof window.supabase === 'undefined') throw new Error('Librería no cargada.');
                
                const supabase = window.supabase.createClient('https://dmpovogobkqxiuqiqdku.supabase.co', 'sb_publishable_vxjNB2Og59jiF0wazOFJBw_-Cj1-q1I');
                const { data, error } = await supabase.from('productos').select('*').eq('estado', 'Disponible').order('codigo_interno', { ascending: true });
                
                if (error) throw new Error(error.message);
                
                todosLosProductos = data;
                datosInventario = {};
                data.forEach(item => {
                    if(!datosInventario[item.categoria]) datosInventario[item.categoria] = [];
                    datosInventario[item.categoria].push(item);
                });

                generarPestañas();
                categoriaActual = Object.keys(datosInventario)[0];
                mostrarCategoria(categoriaActual, 1);
            } catch (err) {
                contenedor.innerHTML = `<div class="bg-red-50 text-red-900 p-6 shadow-sm border border-red-200 text-center"><p class="font-bold">Error de sincronización: ${err.message}</p></div>`;
            }
        }

        function generarPestañas() {
            let html = '';
            for (const cat in datosInventario) {
                html += `<button onclick="mostrarCategoria('${cat}', 1)" id="tab-${cat.replace(/\s+/g, '')}" class="px-6 md:px-8 py-4 text-xs md:text-sm uppercase tracking-[0.15em] transition-all whitespace-nowrap tab-inactiva hover:text-black focus:outline-none">${cat}</button>`;
            }
            document.getElementById('tabs-container').innerHTML = html;
        }

        window.mostrarCategoria = function(categoriaSeleccionada, paginaObjetivo) {
            categoriaActual = categoriaSeleccionada;
            paginaActual = paginaObjetivo;

            for (const cat in datosInventario) {
                const btn = document.getElementById(`tab-${cat.replace(/\s+/g, '')}`);
                if(cat === categoriaActual) {
                    btn.classList.remove('tab-inactiva'); btn.classList.add('tab-activa');
                } else {
                    btn.classList.remove('tab-activa'); btn.classList.add('tab-inactiva');
                }
            }

            const productosTotales = datosInventario[categoriaActual];
            const totalPaginas = Math.ceil(productosTotales.length / itemsPorPagina);
            const productosPagina = productosTotales.slice((paginaActual - 1) * itemsPorPagina, ((paginaActual - 1) * itemsPorPagina) + itemsPorPagina);

            let html = `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 md:gap-12">`;
            
            productosPagina.forEach(p => {
                const imgPath = p.imagen_url ? `https://dmpovogobkqxiuqiqdku.supabase.co/storage/v1/object/public/catalogo/${p.imagen_url}` : 'https://via.placeholder.com/600x800.png?text=Fotograf%C3%ADa+en+proceso';
                
                html += `
                <div class="bg-white shadow-sm hover:shadow-2xl border border-gray-100 flex flex-col overflow-hidden transition-all duration-500 cursor-pointer group rounded-sm" onclick="abrirDetalle('${p.codigo_interno}')">
                    <div class="relative h-[420px] md:h-[480px] bg-gray-100 overflow-hidden">
                        <img src="${imgPath}" alt="${p.nombre_comercial}" class="w-full h-full object-cover object-top">
                    </div>
                    <div class="p-6 text-center bg-white flex-grow flex flex-col justify-center">
                        <h3 class="text-xl md:text-2xl font-serif font-bold text-gray-900 mb-2 tracking-wide">${p.nombre_comercial}</h3>
                        <p class="text-lg font-light text-[#d4af37] tracking-widest">$${p.precio} <span class="text-xs text-gray-400">MXN</span></p>
                    </div>
                </div>`;
            });
            html += `</div>`;
            document.getElementById('catalogo').innerHTML = html;

            renderizarPaginacion(totalPaginas);
        }

        function renderizarPaginacion(totalPaginas) {
            const contPaginacion = document.getElementById('paginacion');
            if (totalPaginas <= 1) { contPaginacion.classList.add('hidden'); return; }
            contPaginacion.classList.remove('hidden');
            
            let htmlPag = `<button onclick="mostrarCategoria('${categoriaActual}', ${paginaActual - 1})" class="px-5 py-2.5 border border-gray-300 hover:border-black text-gray-400 hover:text-black uppercase text-xs tracking-widest transition-colors ${paginaActual === 1 ? 'opacity-30 pointer-events-none' : ''}">Anterior</button>`;
            
            htmlPag += `<span class="text-xs tracking-widest font-mono text-gray-500 px-4">${paginaActual} / ${totalPaginas}</span>`;

            htmlPag += `<button onclick="mostrarCategoria('${categoriaActual}', ${paginaActual + 1})" class="px-5 py-2.5 border border-gray-300 hover:border-black text-gray-400 hover:text-black uppercase text-xs tracking-widest transition-colors ${paginaActual === totalPaginas ? 'opacity-30 pointer-events-none' : ''}">Siguiente</button>`;
            
            contPaginacion.innerHTML = htmlPag;
            if(paginaActual > 1) document.getElementById('tabs-container').scrollIntoView({ behavior: 'smooth' });
        }

        window.abrirDetalle = function(codigo) {
            const p = todosLosProductos.find(x => x.codigo_interno === codigo);
            const imgPath = p.imagen_url ? `https://dmpovogobkqxiuqiqdku.supabase.co/storage/v1/object/public/catalogo/${p.imagen_url}` : 'https://via.placeholder.com/600x800.png?text=Fotograf%C3%ADa+en+proceso';
            const textoWapp = `Hola Laollaga Istmeña, me interesa adquirir la pieza exclusiva: ${p.codigo_interno} - ${p.nombre_comercial}.`;
            const enlaceWapp = `https://wa.me/529711140709?text=${encodeURIComponent(textoWapp)}`;

            document.getElementById('modal-content').innerHTML = `
                <div class="w-full md:w-3/5 bg-black flex items-center justify-center relative min-h-[50vh] md:min-h-screen p-4 md:p-10 overflow-hidden">
                    <div class="w-full h-full max-h-[85vh] md:max-h-[90vh] flex items-center justify-center rounded overflow-hidden">
                        <img id="img-zoomable" src="${imgPath}" class="zoom-normal w-full h-full object-contain cursor-zoom-in" onclick="toggleZoom(this)" title="Toca para hacer zoom">
                    </div>
                </div>
                <div class="w-full md:w-2/5 p-6 md:p-14 flex flex-col justify-center bg-[#fcfbf9]">
                    <p class="text-xs text-gray-400 font-mono mb-3 tracking-[0.2em] uppercase">${p.codigo_interno}</p>
                    <h2 class="text-3xl md:text-4xl font-serif font-bold text-gray-900 leading-tight mb-4">${p.nombre_comercial}</h2>
                    <p class="text-3xl font-light text-[#d4af37] mb-8">$${p.precio} <span class="text-sm text-gray-400 font-sans">MXN</span></p>

                    <div class="space-y-6 mb-10 border-t border-b border-gray-200 py-6">
                        <div>
                            <span class="block text-[10px] uppercase tracking-widest text-gray-400 mb-1">Medidas y Talla</span>
                            <span class="font-medium text-gray-900 text-base md:text-lg">${p.talla || ''} ${p.medidas !== 'N/A' ? p.medidas : ''}</span>
                        </div>
                        <div>
                            <span class="block text-[10px] uppercase tracking-widest text-gray-400 mb-1">Material / Confección</span>
                            <span class="font-medium text-gray-900 text-base md:text-lg">${p.material}</span>
                        </div>
                        <div>
                            <span class="block text-[10px] uppercase tracking-widest text-gray-400 mb-1">Mantenimiento</span>
                            <span class="font-medium text-gray-900 text-base md:text-lg">${p.cuidados}</span>
                        </div>
                    </div>

                    <a href="${enlaceWapp}" target="_blank" class="block w-full text-center bg-black hover:bg-[#b91c1c] text-white font-bold py-4 md:py-5 rounded-sm uppercase text-sm tracking-widest shadow-xl transition-all hover:shadow-2xl">
                        <i class="fab fa-whatsapp text-lg mr-2"></i> Adquirir esta pieza
                    </a>
                </div>
            `;
            const modal = document.getElementById('modal-producto');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
            document.body.style.overflow = 'hidden'; 
        }

        // Función para activar y desactivar el zoom por toque o clic de forma limpia
        window.toggleZoom = function(imgElement) {
            imgElement.classList.toggle('zoom-activo');
        }

        window.cerrarDetalle = function() {
            const modal = document.getElementById('modal-producto');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                document.body.style.overflow = 'auto';
            }, 300);
        }

        setTimeout(cargarCatalogo, 600);
    </script>
</body>
</html>
