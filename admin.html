<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control | Laollaga Istmeña</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">
    <header class="bg-black text-white p-4 flex justify-between items-center shadow-md">
        <h1 class="text-lg md:text-xl font-bold tracking-widest uppercase text-[#d4af37]">Control de Inventario</h1>
        <a href="index.html" class="text-sm bg-gray-800 px-3 py-1 rounded hover:bg-gray-700">Ver Catálogo ↗</a>
    </header>

    <main class="max-w-4xl mx-auto p-4 mt-4">
        <div class="grid grid-cols-3 gap-2 md:gap-4 mb-8 text-center">
            <div class="bg-white p-4 rounded shadow border-t-4 border-blue-500"><p class="text-2xl font-bold" id="total">0</p><p class="text-[10px] md:text-xs uppercase text-gray-500 font-bold mt-1">Registradas</p></div>
            <div class="bg-white p-4 rounded shadow border-t-4 border-green-500"><p class="text-2xl font-bold text-green-600" id="disp">0</p><p class="text-[10px] md:text-xs uppercase text-gray-500 font-bold mt-1">Disponibles</p></div>
            <div class="bg-white p-4 rounded shadow border-t-4 border-red-500"><p class="text-2xl font-bold text-red-600" id="agot">0</p><p class="text-[10px] md:text-xs uppercase text-gray-500 font-bold mt-1">Agotadas</p></div>
        </div>

        <div id="panel" class="space-y-4">
            <div class="text-center py-10 text-gray-500">Sincronizando con base de datos...</div>
        </div>
    </main>

    <script>
        const supabase = window.supabase.createClient('https://dmpovogobkqxiuqiqdku.supabase.co', 'sb_publishable_vxjNB2Og59jiF0wazOFJBw_-Cj1-q1I');

        async function cargarAdmin() {
            const { data, error } = await supabase.from('productos').select('*').order('codigo_interno', { ascending: true });
            if (error) return alert('Error al cargar datos del servidor.');

            document.getElementById('total').innerText = data.length;
            document.getElementById('disp').innerText = data.filter(d => d.estado === 'Disponible').length;
            document.getElementById('agot').innerText = data.filter(d => d.estado !== 'Disponible').length;

            const categorias = {};
            data.forEach(item => {
                if(!categorias[item.categoria]) categorias[item.categoria] = [];
                categorias[item.categoria].push(item);
            });

            let html = '';
            for (const cat in categorias) {
                html += `<h2 class="text-lg font-bold mt-8 mb-3 uppercase text-gray-700 bg-gray-200 px-3 py-1 inline-block rounded">${cat}</h2>`;
                categorias[cat].forEach(p => {
                    const esDisp = p.estado === 'Disponible';
                    const borde = esDisp ? 'border-green-500' : 'border-red-500';
                    const txtEstado = esDisp ? 'text-green-600' : 'text-red-600';
                    const boton = esDisp 
                        ? `<button onclick="cambiarEstado('${p.id}', 'Agotado')" class="bg-[#b91c1c] hover:bg-red-800 text-white px-4 py-3 md:py-2 rounded text-sm font-bold w-full md:w-auto shadow">Marcar Agotado</button>`
                        : `<button onclick="cambiarEstado('${p.id}', 'Disponible')" class="bg-gray-800 hover:bg-black text-white px-4 py-3 md:py-2 rounded text-sm font-bold w-full md:w-auto shadow">Reactivar (Disponible)</button>`;

                    html += `
                    <div class="bg-white p-4 rounded shadow flex flex-col md:flex-row justify-between items-start md:items-center border-l-4 ${borde} mb-3 gap-4">
                        <div class="w-full">
                            <span class="text-xs font-mono bg-gray-100 text-gray-600 px-2 py-1 rounded border">${p.codigo_interno}</span>
                            <h3 class="font-bold text-lg mt-1">${p.nombre_comercial}</h3>
                            <p class="text-sm text-gray-500 mt-1">$${p.precio} MXN — Estado: <strong class="${txtEstado}">${p.estado}</strong></p>
                        </div>
                        <div class="w-full md:w-auto flex-shrink-0">${boton}</div>
                    </div>`;
                });
            }
            document.getElementById('panel').innerHTML = html;
        }

        window.cambiarEstado = async function(id, nuevoEstado) {
            const { error } = await supabase.from('productos').update({ estado: nuevoEstado }).eq('id', id);
            if (error) alert('Error de sincronización.');
            else cargarAdmin();
        }

        cargarAdmin();
    </script>
</body>
</html>
