<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control V3 | Laollaga Istmeña</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#fcfbf9] font-sans text-gray-800">
    
    <div class="bg-black text-[#d4af37] p-5 flex justify-between items-center shadow-lg border-b-2 border-[#d4af37]">
        <h1 class="font-serif font-bold tracking-[0.2em] uppercase">Control Maestro V3</h1>
        <a href="index.html" class="text-white text-xs tracking-widest uppercase hover:text-[#d4af37] transition-colors">Ver Catálogo</a>
    </div>

    <div class="max-w-2xl mx-auto mt-10 bg-white p-8 rounded-sm shadow-2xl border border-gray-100">
        <h2 class="text-2xl font-serif font-bold mb-6 border-b pb-2">Registrar Nueva Pieza</h2>
        
        <form id="form-producto" class="space-y-5 text-sm">
            <div class="grid grid-cols-2 gap-4">
                <input type="text" id="codigo" placeholder="Código (Ej: DT-001)" class="w-full border border-gray-300 p-3 focus:border-black focus:outline-none" required>
                <input type="text" id="nombre" placeholder="Nombre Comercial" class="w-full border border-gray-300 p-3 focus:border-black focus:outline-none" required>
            </div>

            <!-- CAMPO INTELIGENTE DE CATEGORÍA -->
            <div>
                <label class="text-xs text-gray-500 uppercase tracking-widest block mb-1">Categoría (Selecciona o escribe una nueva)</label>
                <input type="text" id="categoria" list="lista-categorias" placeholder="Ej: Diademas de Terciopelo" class="w-full border border-gray-300 p-3 focus:border-black focus:outline-none bg-yellow-50" required>
                <datalist id="lista-categorias"></datalist>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <input type="number" id="precio" placeholder="Precio ($)" class="w-full border border-gray-300 p-3 focus:border-black focus:outline-none" required>
                <input type="text" id="talla" placeholder="Talla (Ej: Única)" class="w-full border border-gray-300 p-3 focus:border-black focus:outline-none">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <input type="text" id="medidas" placeholder="Medidas (o N/A)" class="w-full border border-gray-300 p-3 focus:border-black focus:outline-none">
                <input type="text" id="material" placeholder="Material" class="w-full border border-gray-300 p-3 focus:border-black focus:outline-none">
            </div>

            <input type="text" id="cuidados" placeholder="Mantenimiento / Cuidados" class="w-full border border-gray-300 p-3 focus:border-black focus:outline-none">

            <!-- NUEVO CAMPO: ESLOGAN -->
            <div>
                <label class="text-xs text-gray-500 uppercase tracking-widest block mb-1">Eslogan de la pieza (Aparecerá en el modal)</label>
                <textarea id="eslogan" placeholder="Corona de terciopelo que enmarca el porte y la majestad..." class="w-full border border-gray-300 p-3 focus:border-black focus:outline-none" rows="2" required></textarea>
            </div>

            <input type="text" id="imagen" placeholder="Nombre exacto de la foto (Ej: foto1.jpg)" class="w-full border border-gray-300 p-3 focus:border-black focus:outline-none bg-gray-50" required>

            <button type="submit" class="w-full bg-black text-white font-bold py-4 uppercase tracking-[0.2em] shadow-xl hover:bg-[#1a1a1a] transition-colors">Guardar en Base de Datos</button>
        </form>
        <div id="mensaje" class="mt-6 font-bold text-center uppercase tracking-widest text-xs"></div>
    </div>

    <script>
        const supabase = window.supabase.createClient('https://dmpovogobkqxiuqiqdku.supabase.co', 'sb_publishable_vxjNB2Og59jiF0wazOFJBw_-Cj1-q1I');

        // Autocompletado de categorías existentes
        async function cargarCategorias() {
            const { data, error } = await supabase.from('productos').select('categoria');
            if (!error && data) {
                const categoriasUnicas = [...new Set(data.map(item => item.categoria))];
                const datalist = document.getElementById('lista-categorias');
                categoriasUnicas.forEach(cat => { datalist.innerHTML += `<option value="${cat}">`; });
            }
        }
        cargarCategorias();

        document.getElementById('form-producto').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = "Sincronizando...";

            const nuevoProducto = {
                codigo_interno: document.getElementById('codigo').value,
                nombre_comercial: document.getElementById('nombre').value,
                categoria: document.getElementById('categoria').value,
                precio: document.getElementById('precio').value,
                talla: document.getElementById('talla').value || 'N/A',
                medidas: document.getElementById('medidas').value || 'N/A',
                material: document.getElementById('material').value || 'N/A',
                cuidados: document.getElementById('cuidados').value || 'N/A',
                eslogan: document.getElementById('eslogan').value,
                imagen_url: document.getElementById('imagen').value,
                estado: 'Disponible'
            };

            const { error } = await supabase.from('productos').insert([nuevoProducto]);

            if (error) {
                document.getElementById('mensaje').innerHTML = `<span class="text-red-600"><i class="fas fa-times-circle"></i> Error: ${error.message}</span>`;
            } else {
                document.getElementById('mensaje').innerHTML = `<span class="text-green-600"><i class="fas fa-check-circle"></i> Pieza registrada y publicada exitosamente</span>`;
                e.target.reset();
                cargarCategorias(); // Refrescar lista por si se añadió categoría nueva
            }
            btn.innerText = "Guardar en Base de Datos";
        });
    </script>
</body>
</html>
