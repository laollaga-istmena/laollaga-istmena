<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control V2 | Laollaga Istmeña</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-20">
    <header class="bg-black text-white p-4 flex justify-between items-center shadow-md">
        <h1 class="text-lg md:text-xl font-bold tracking-widest uppercase text-[#d4af37]">Control V2</h1>
        <a href="index.html" class="text-sm bg-gray-800 px-3 py-1 rounded hover:bg-gray-700">Ver Catálogo ↗</a>
    </header>

    <main class="max-w-5xl mx-auto p-4 mt-4">
        <!-- Formulario Alta de Productos -->
        <div class="bg-white p-6 rounded-lg shadow-md border-t-4 border-black mb-8">
            <h2 class="text-xl font-bold mb-4 uppercase">Registrar Nuevo Producto</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="text" id="n_codigo" placeholder="Código (Ej: HC-025)" class="border p-2 rounded">
                <input type="text" id="n_nombre" placeholder="Nombre Comercial" class="border p-2 rounded">
                <select id="n_cat" class="border p-2 rounded"><option>Guías Florales</option><option>Huipiles de Cadenilla</option></select>
                <input type="number" id="n_precio" placeholder="Precio ($)" class="border p-2 rounded">
                <input type="text" id="n_talla" placeholder="Talla" class="border p-2 rounded">
                <input type="text" id="n_medidas" placeholder="Medidas (o N/A)" class="border p-2 rounded">
                <input type="text" id="n_material" placeholder="Material" class="border p-2 rounded">
                <input type="text" id="n_cuidados" placeholder="Cuidados" class="border p-2 rounded">
                <input type="text" id="n_imagen" placeholder="Archivo Foto (Ej: nueva.jpg)" class="border p-2 rounded">
            </div>
            <button onclick="crearProducto()" class="mt-4 bg-green-700 hover:bg-green-900 text-white font-bold py-2 px-6 rounded w-full md:w-auto">Guardar Nuevo Producto</button>
        </div>

        <h2 class="text-xl font-bold mb-4 uppercase border-b-2 border-gray-300 pb-2">Inventario Actual</h2>
        <div id="panel" class="space-y-4">Cargando base de datos...</div>
    </main>

    <script>
        const supabase = window.supabase.createClient('https://dmpovogobkqxiuqiqdku.supabase.co', 'sb_publishable_vxjNB2Og59jiF0wazOFJBw_-Cj1-q1I');

        async function cargarAdmin() {
            const { data, error } = await supabase.from('productos').select('*').order('codigo_interno', { ascending: true });
            if (error) return document.getElementById('panel').innerHTML = 'Error de conexión.';

            let html = '';
            data.forEach(p => {
                const esDisp = p.estado === 'Disponible';
                const borde = esDisp ? 'border-green-500' : 'border-red-500';
                const imgTag = p.imagen_url ? `<img src="https://dmpovogobkqxiuqiqdku.supabase.co/storage/v1/object/public/catalogo/${p.imagen_url}" class="w-16 h-16 object-cover rounded border">` : `<div class="w-16 h-16 bg-gray-200 flex items-center justify-center text-xs text-gray-500 rounded">Sin foto</div>`;
                
                html += `
                <div class="bg-white p-4 rounded shadow flex flex-col md:flex-row justify-between items-start md:items-center border-l-4 ${borde} gap-4">
                    <div class="flex gap-4 items-center w-full md:w-auto">
                        ${imgTag}
                        <div>
                            <span class="text-xs font-mono bg-gray-100 px-2 py-1 rounded border">${p.codigo_interno}</span>
                            <h3 class="font-bold text-lg leading-tight mt-1">${p.nombre_comercial}</h3>
                            <p class="text-sm text-gray-500">$${p.precio} MXN | ${p.estado}</p>
                        </div>
                    </div>
                    <div class="flex flex-col md:flex-row gap-2 w-full md:w-auto">
                        <div class="flex">
                            <input type="text" id="img_${p.id}" value="${p.imagen_url || ''}" placeholder="Ej: GF-001.jpg" class="border p-2 text-sm rounded-l w-full md:w-32 outline-none focus:border-blue-500">
                            <button onclick="vincularFoto('${p.id}')" class="bg-blue-600 hover:bg-blue-800 text-white px-3 py-2 text-sm font-bold rounded-r">Asignar Foto</button>
                        </div>
                        <button onclick="cambiarEstado('${p.id}', '${esDisp ? 'Agotado' : 'Disponible'}')" class="${esDisp ? 'bg-[#b91c1c]' : 'bg-gray-800'} text-white px-4 py-2 rounded text-sm font-bold shadow">${esDisp ? 'Marcar Agotado' : 'Reactivar'}</button>
                    </div>
                </div>`;
            });
            document.getElementById('panel').innerHTML = html;
        }

        window.vincularFoto = async function(id) {
            const archivo = document.getElementById(`img_${id}`).value.trim();
            const { error } = await supabase.from('productos').update({ imagen_url: archivo }).eq('id', id);
            if (error) alert('Error al vincular'); else cargarAdmin();
        }

        window.cambiarEstado = async function(id, nuevoEstado) {
            const { error } = await supabase.from('productos').update({ estado: nuevoEstado }).eq('id', id);
            if (!error) cargarAdmin();
        }

        window.crearProducto = async function() {
            const nuevo = {
                codigo_interno: document.getElementById('n_codigo').value,
                nombre_comercial: document.getElementById('n_nombre').value,
                categoria: document.getElementById('n_cat').value,
                precio: parseFloat(document.getElementById('n_precio').value),
                talla: document.getElementById('n_talla').value,
                medidas: document.getElementById('n_medidas').value,
                material: document.getElementById('n_material').value,
                cuidados: document.getElementById('n_cuidados').value,
                imagen_url: document.getElementById('n_imagen').value,
                estado: 'Disponible'
            };
            if(!nuevo.codigo_interno || !nuevo.nombre_comercial) return alert('Código y Nombre son obligatorios.');
            
            const { error } = await supabase.from('productos').insert([nuevo]);
            if (error) alert('Error al guardar en base de datos.');
            else { alert('Producto agregado exitosamente.'); location.reload(); }
        }

        cargarAdmin();
    </script>
</body>
</html>
